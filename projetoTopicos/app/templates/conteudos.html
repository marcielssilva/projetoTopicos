{% extends "base.html" %}

{% block content %}

<div class="breadcrumb">
    <a href="/">Início</a>
    <span class="sep">›</span>
    <a href="/categoria/{{ categoria }}">{{ categoria }}</a>
    <span class="sep">›</span>
    <span class="current">{{ sub }}</span>
</div>

<div class="card">
    <div class="card-title">
        <div class="icon">📄</div>
        {{ sub }}
    </div>

    {% for item in dados %}
        <a href="/abrir/{{ item._id }}" class="btn">
            🔹 {{ item.titulo }}
            <span class="btn-arrow">›</span>
        </a>
    {% endfor %}

    <a href="/categoria/{{ categoria }}" class="btn btn-back">‹ Voltar</a>
</div>

{% endblock %}
