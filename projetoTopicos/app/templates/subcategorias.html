{% extends "base.html" %}

{% block content %}

<div class="breadcrumb">
    <a href="/">Início</a>
    <span class="sep">›</span>
    <span class="current">{{ categoria }}</span>
</div>

<div class="card">
    <div class="card-title">
        <div class="icon">📂</div>
        {{ categoria }}
    </div>

    {% for sub in subs %}
        <a href="/conteudos/{{ categoria }}/{{ sub }}" class="btn">
            📋 {{ sub }}
            <span class="btn-arrow">›</span>
        </a>
    {% endfor %}

    <a href="/" class="btn btn-back">‹ Voltar ao início</a>
</div>

{% endblock %}
