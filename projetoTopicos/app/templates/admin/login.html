<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHNET | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:'Inter','Segoe UI',sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1a56db 100%);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .login-box {
            background:#fff; border-radius:16px; padding:40px 36px;
            width:100%; max-width:380px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            animation: slideUp .4s ease;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .login-logo {
            text-align:center; margin-bottom:28px;
        }
        .login-logo .icon-wrap {
            width:56px; height:56px; background:linear-gradient(135deg,#1a56db,#1d4ed8);
            border-radius:14px; display:inline-flex; align-items:center; justify-content:center;
            font-size:26px; margin-bottom:12px;
            box-shadow: 0 8px 20px rgba(26,86,219,.3);
        }
        .login-logo h1 { font-size:20px; font-weight:700; color:#1e293b; margin-bottom:2px; }
        .login-logo p  { font-size:13px; color:#64748b; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
        .form-group input {
            width:100%; padding:11px 14px; border:1.5px solid #e2e8f0; border-radius:9px;
            font-size:14px; font-family:inherit; outline:none; transition:.2s; color:#1e293b;
        }
        .form-group input:focus { border-color:#1a56db; box-shadow:0 0 0 3px rgba(26,86,219,.1); }
        .btn-login {
            width:100%; padding:12px; background:linear-gradient(135deg,#1a56db,#1d4ed8);
            color:#fff; border:none; border-radius:9px; font-size:15px;
            font-weight:600; cursor:pointer; font-family:inherit; transition:.2s;
            box-shadow: 0 4px 14px rgba(26,86,219,.35);
            margin-top:4px;
        }
        .btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(26,86,219,.4); }
        .btn-login:active { transform:translateY(0); }
        .erro {
            background:#fee2e2; color:#991b1b; border:1px solid #fecaca;
            border-radius:8px; padding:10px 14px; font-size:13.5px;
            margin-bottom:16px; display:flex; align-items:center; gap:8px;
        }
        .back-link { display:block; text-align:center; margin-top:20px; font-size:13px; color:#64748b; text-decoration:none; }
        .back-link:hover { color:#1a56db; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-logo">
        <div class="icon-wrap">📡</div>
        <h1>Painel Admin</h1>
        <p>MHNET — Manual do Atendimento</p>
    </div>

    {% if erro %}
    <div class="erro">⚠️ {{ erro }}</div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" name="usuario" placeholder="Digite seu usuário" autofocus required>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Entrar no Painel →</button>
    </form>

    <a href="/" class="back-link">← Voltar ao manual</a>
</div>
</body>
</html>
