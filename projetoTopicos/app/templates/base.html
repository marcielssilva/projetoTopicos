<!DOCTYPE html>
<html>
<head>
    <title>Fluxo de Atendimento</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f3f5;
            margin: 0;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0b5ed7;
        }

        .btn-back {
            background: #6c757d;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<header>
    📡 Fluxo Técnico
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
