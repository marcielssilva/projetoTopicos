<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHNET | Manual do Atendimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary:    #1a56db;
            --primary-dk: #1341b0;
            --primary-lt: #eff6ff;
            --accent:     #f97316;
            --bg:         #f0f4f8;
            --surface:    #ffffff;
            --border:     #e2e8f0;
            --text:       #1e293b;
            --muted:      #64748b;
            --header-h:   60px;
            --radius:     12px;
            --shadow:     0 1px 3px rgba(0,0,0,.07), 0 4px 14px rgba(0,0,0,.06);
        }
        body { font-family:'Inter','Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* ── HEADER ── */
        header {
            position:fixed; top:0; left:0; right:0;
            height:var(--header-h);
            background:var(--primary);
            display:flex; align-items:center;
            padding:0 24px; gap:14px; z-index:200;
            box-shadow:0 2px 8px rgba(0,0,0,.2);
        }
        .header-brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:#fff; flex-shrink:0; }
        .header-logo { width:32px; height:32px; background:rgba(255,255,255,.18); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:17px; }
        .header-name { font-weight:700; font-size:16px; }
        .header-sub  { font-size:10px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; }

        .search-bar {
            flex:1; max-width:480px; margin:0 12px;
            display:flex; align-items:center;
            background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.25);
            border-radius:8px; overflow:hidden; transition:.2s;
        }
        .search-bar:focus-within { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.5); }
        .search-bar input { flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14px; padding:9px 14px; font-family:inherit; }
        .search-bar input::placeholder { color:rgba(255,255,255,.6); }
        .search-bar button { background:transparent; border:none; cursor:pointer; padding:9px 13px; color:rgba(255,255,255,.8); font-size:16px; transition:.15s; }
        .search-bar button:hover { color:#fff; }

        .header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
        .header-admin-btn {
            display:flex; align-items:center; gap:5px;
            color:rgba(255,255,255,.75); font-size:12px; font-weight:500;
            text-decoration:none; padding:6px 12px;
            border:1px solid rgba(255,255,255,.25); border-radius:6px; transition:.15s;
        }
        .header-admin-btn:hover { background:rgba(255,255,255,.15); color:#fff; }

        /* ── LAYOUT ── */
        .layout { padding-top:var(--header-h); min-height:100vh; }
        .main { padding:32px 24px 56px; }
        .container { max-width:780px; margin:0 auto; }

        /* ── BREADCRUMB ── */
        .breadcrumb { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:20px; flex-wrap:wrap; }
        .breadcrumb a { color:var(--primary); text-decoration:none; font-weight:500; }
        .breadcrumb a:hover { text-decoration:underline; }
        .breadcrumb .sep { color:#cbd5e1; }
        .breadcrumb .current { color:var(--text); font-weight:500; }

        /* ── CARD ── */
        .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); padding:22px; margin-bottom:14px; }
        .card-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .card-title .icon { width:30px; height:30px; background:var(--primary-lt); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:15px; }

        /* ── BOTÕES ── */
        .btn {
            display:flex; align-items:center; gap:10px; width:100%;
            padding:13px 16px; margin-bottom:7px;
            background:#f8faff; color:var(--text);
            border:1.5px solid var(--border); border-radius:10px;
            font-size:14.5px; font-weight:500; cursor:pointer;
            text-align:left; transition:all .17s; font-family:inherit; text-decoration:none;
        }
        .btn:hover { background:var(--primary-lt); border-color:var(--primary); color:var(--primary); transform:translateX(2px); }
        .btn .btn-arrow { margin-left:auto; color:#cbd5e1; font-size:16px; transition:.17s; }
        .btn:hover .btn-arrow { color:var(--primary); }
        .btn-back { background:#f8fafc; color:var(--muted); border-color:var(--border); margin-top:4px; }
        .btn-back:hover { background:#f1f5f9; color:var(--text); border-color:#94a3b8; transform:none; }
        .btn-apoio { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn-apoio:hover { background:#ea6c0a; border-color:#ea6c0a; color:#fff; transform:translateX(2px); }

        /* ── FLUXO ── */
        .fluxo-header { background:linear-gradient(135deg,#1a56db 0%,#1d4ed8 100%); border-radius:var(--radius); padding:22px 24px; margin-bottom:14px; color:#fff; }
        .fluxo-header h2 { font-size:19px; font-weight:700; margin-bottom:8px; }
        .fluxo-header p  { font-size:13.5px; opacity:.88; line-height:1.6; }
        .secao-card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:14px; overflow:hidden; }
        .secao-header { background:#f8faff; border-bottom:1px solid var(--border); padding:12px 18px; display:flex; align-items:center; gap:10px; }
        .secao-numero { width:24px; height:24px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
        .secao-titulo { font-weight:600; font-size:14.5px; color:var(--text); }
        .secao-body { padding:14px 18px; }
        .passos-list { list-style:none; counter-reset:passo; }
        .passos-list li { counter-increment:passo; display:flex; gap:11px; padding:9px 0; font-size:13.5px; line-height:1.55; border-bottom:1px solid #f1f5f9; }
        .passos-list li:last-child { border-bottom:none; }
        .passos-list li::before { content:counter(passo); min-width:21px; height:21px; background:var(--primary-lt); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; margin-top:1px; }
        .apoio-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }

        /* ── PÁGINA INICIAL ── */
        .page-intro { text-align:center; padding:8px 0 24px; }
        .page-intro h1 { font-size:21px; font-weight:700; margin-bottom:5px; }
        .page-intro p  { font-size:13.5px; color:var(--muted); }
        .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-top:4px; }
        .cat-card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 14px; background:#f8faff; border:1.5px solid var(--border); border-radius:var(--radius); text-decoration:none; color:var(--text); transition:all .18s; text-align:center; font-size:14px; font-weight:600; }
        .cat-card:hover { background:var(--primary-lt); border-color:var(--primary); color:var(--primary); transform:translateY(-2px); box-shadow:0 4px 14px rgba(26,86,219,.12); }
        .cat-card .cat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; }

        /* ── FLASH ── */
        .flash { padding:10px 16px; border-radius:8px; font-size:13.5px; font-weight:500; margin-bottom:14px; }
        .flash.success { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
        .flash.info    { background:#e0f2fe; color:#075985; border:1px solid #bae6fd; }
        .flash.error   { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }

        /* ── RESPONSIVO ── */
        @media(max-width:768px){
            .main { padding:20px 14px 48px; }
            .cat-grid { grid-template-columns:1fr 1fr; }
            .apoio-grid { grid-template-columns:1fr; }
            .search-bar { max-width:200px; }
            .header-admin-btn span { display:none; }
        }
        footer { text-align:center; padding:20px; font-size:12px; color:#94a3b8; }
    </style>
</head>
<body>

<header>
    <a href="/" class="header-brand">
        <div class="header-logo">📡</div>
        <div><div class="header-name">MHNET</div><div class="header-sub">Manual do Atendimento</div></div>
    </a>

    <form class="search-bar" action="/busca" method="get">
        <input type="text" name="q" placeholder="Pesquisar fluxo..." value="{{ request.args.get('q','') }}" autocomplete="off">
        <button type="submit">🔍</button>
    </form>

    <div class="header-right">
        <a href="/admin" class="header-admin-btn">⚙️ <span>Admin</span></a>
    </div>
</header>

<div class="layout">
    <main class="main">
        <div class="container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="flash {{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
        <footer>MHNET &copy; 2025 — Sistema de Fluxo de Atendimento</footer>
    </main>
</div>

</body>
</html>
